name: AIRecorder
options:
  bundleIdPrefix: com.danielmartorell
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  AIRecorder:
    type: application
    platform: iOS
    sources:
      - path: AIRecorder
        excludes:
          - Resources/Supabase.plist
    preBuildScripts:
      - name: Bundle local Supabase configuration
        script: |
          if [ -f "${SRCROOT}/AIRecorder/Resources/Supabase.plist" ]; then
            cp "${SRCROOT}/AIRecorder/Resources/Supabase.plist" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Supabase.plist"
          fi
    info:
      path: AIRecorder/App/Info.plist
      properties:
        NSMicrophoneUsageDescription: AI Recorder needs microphone access to record audio offline.
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLSchemes: [com.danielmartorell.ai-recorder]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.danielmartorell.AIRecorder
      DEVELOPMENT_TEAM: 89ZFGW6H88
      GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: Supabase
    scheme:
      testTargets: [AIRecorderTests, AIRecorderUITests]
  AIRecorderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AIRecorderTests/UI]
    dependencies: [target: AIRecorder]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.danielmartorell.AIRecorderUITests
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: AIRecorder
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
  AIRecorderTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AIRecorderTests/CaptureProof, AIRecorderTests/Capture, AIRecorderTests/Storage, AIRecorderTests/Persistence, AIRecorderTests/Features]
    info:
      path: AIRecorderTests/Info.plist
      properties:
        NSMicrophoneUsageDescription: AI Recorder needs microphone access to record audio offline.
        UIBackgroundModes: [audio]
    dependencies: [target: AIRecorder]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.danielmartorell.AIRecorderTests
      GENERATE_INFOPLIST_FILE: NO
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AIRecorder.app/AIRecorder"
      BUNDLE_LOADER: "$(TEST_HOST)"
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      SWIFT_EMIT_LOC_STRINGS: NO
